# XcodeGen project description. The GitHub build turns this into ChronPod.xcodeproj
# (`xcodegen generate`), so no Xcode project file has to be kept in the repository.
name: ChronPod
options:
  bundleIdPrefix: com.chronlaw
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

packages:
  ChronPodCore:
    path: ChronPodCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"

targets:
  ChronPod:
    type: application
    platform: iOS
    sources:
      - path: ChronPod
    dependencies:
      - package: ChronPodCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chronlaw.chronpod
        PRODUCT_NAME: ChronPod
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    info:
      path: ChronPod/Info.plist
      properties:
        CFBundleDisplayName: ChronPod
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: AccentColor
        UIBackgroundModes:
          - audio
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.chronlaw.chronpod.refresh
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Many podcast feeds and media files are still served over plain http (AntennaPod allows this too).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false

schemes:
  ChronPod:
    build:
      targets:
        ChronPod: all
    run:
      config: Debug
    archive:
      config: Release
